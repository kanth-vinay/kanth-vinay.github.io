<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Problem Translation Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .highlight-active { background-color: #fef08a; /* yellow-200 */ border-radius: 2px; }
        .step-locked { opacity: 0.6; pointer-events: none; filter: grayscale(100%); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen">

    <div id="app" class="max-w-2xl mx-auto p-4 md:p-6 lg:p-8 flex flex-col gap-6">
        <!-- Header -->
        <header class="flex justify-between items-center mb-2">
            <div>
                <h1 class="text-2xl font-bold text-slate-800">Math Translation Practice</h1>
                <p class="text-sm text-slate-500">Take it one step at a time.</p>
            </div>
            <div id="progress-indicator" class="text-sm font-semibold bg-indigo-100 text-indigo-700 py-1 px-3 rounded-full">
                Problem 1
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="main-content" class="flex flex-col gap-6 pb-20">
            <!-- Dynamic Content Injected Here -->
        </main>
    </div>

    <script>
        // Data payload
        const quizData = {
          "instructions": "Each problem maps to the 4-step flow.",
          "relationshipTypes": [
            "one is more/less than the other",
            "one is a multiple of the other",
            "parts add up to a whole",
            "something is split evenly",
            "a rate or ratio"
          ],
          "problems": [
            { "id": 1, "tier": 1, "type": "comparison", "classificationLabel": "one is more/less than the other", "text": "Ethan has 12 more trading cards than his sister Ava. Together they have 58 cards. How many cards does Ava have?", "unknownDescription": "Ava's number of cards", "equation": "x + (x + 12) = 58", "answer": 23, "answerUnit": "cards" },
            { "id": 2, "tier": 1, "type": "rate", "classificationLabel": "a rate or ratio", "text": "A store sells pencils in packs of 8. If Maria buys 6 packs, how many pencils does she have in total?", "unknownDescription": "total pencils", "equation": "x = 8 * 6", "answer": 48, "answerUnit": "pencils" },
            { "id": 3, "tier": 1, "type": "multiplicative", "classificationLabel": "one is a multiple of the other", "text": "A garden has 4 times as many tulips as roses. There are 9 roses. How many tulips are there?", "unknownDescription": "number of tulips", "equation": "x = 4 * 9", "answer": 36, "answerUnit": "tulips" },
            { "id": 4, "tier": 1, "type": "spliteven", "classificationLabel": "something is split evenly", "text": "A rope is cut into 6 equal pieces. Each piece is 7 feet long. What was the original length of the rope?", "unknownDescription": "original rope length", "equation": "x = 6 * 7", "answer": 42, "answerUnit": "feet" },
            { "id": 5, "tier": 1, "type": "partwhole", "classificationLabel": "parts add up to a whole", "text": "A classroom has 34 students total. 15 of them are boys. How many girls are in the class?", "unknownDescription": "number of girls", "equation": "x + 15 = 34", "answer": 19, "answerUnit": "students" },
            { "id": 6, "tier": 1, "type": "comparison", "classificationLabel": "one is more/less than the other", "text": "Liam scored 9 points fewer than his teammate Noah in a basketball game. Noah scored 27 points. How many points did Liam score?", "unknownDescription": "Liam's points", "equation": "x = 27 - 9", "answer": 18, "answerUnit": "points" },
            { "id": 7, "tier": 1, "type": "spliteven", "classificationLabel": "something is split evenly", "text": "Sofia bought 5 movie tickets for a total of $60. Each ticket costs the same amount. What is the price of one ticket?", "unknownDescription": "price of one ticket", "equation": "x = 60 / 5", "answer": 12, "answerUnit": "dollars" },
            { "id": 8, "tier": 1, "type": "multiplicative", "classificationLabel": "one is a multiple of the other", "text": "Zoe read 3 times as many books this summer as her friend Priya. Priya read 6 books. How many books did Zoe read?", "unknownDescription": "Zoe's number of books", "equation": "x = 3 * 6", "answer": 18, "answerUnit": "books" },
            { "id": 9, "tier": 1, "type": "partwhole", "classificationLabel": "parts add up to a whole", "text": "A fruit basket contains apples and oranges. There are 14 apples. The basket has 30 pieces of fruit in total. How many oranges are there?", "unknownDescription": "number of oranges", "equation": "x + 14 = 30", "answer": 16, "answerUnit": "oranges" },
            { "id": 10, "tier": 1, "type": "multiplicative", "classificationLabel": "one is a multiple of the other", "text": "Grandma Rosa is 3 times as old as her granddaughter Elena. Grandma Rosa is 66 years old. How old is Elena?", "unknownDescription": "Elena's age", "equation": "3 * x = 66", "answer": 22, "answerUnit": "years old" },
            { "id": 11, "tier": 2, "type": "rate", "classificationLabel": "a rate or ratio", "text": "A recipe calls for 2 cups of flour for every batch of cookies. Jenna wants to make 5 batches for a school bake sale on Friday. How many cups of flour does she need?", "unknownDescription": "cups of flour needed", "equation": "x = 2 * 5", "answer": 10, "answerUnit": "cups" },
            { "id": 12, "tier": 2, "type": "comparison", "classificationLabel": "one is more/less than the other", "text": "Camden and his older brother Tyler both collect stamps in a binder. Camden has 8 more stamps than Tyler. Camden keeps his binder on the top shelf. Together they have 52 stamps. How many stamps does Tyler have?", "unknownDescription": "Tyler's number of stamps", "equation": "x + (x + 8) = 52", "answer": 22, "answerUnit": "stamps" },
            { "id": 13, "tier": 2, "type": "spliteven", "classificationLabel": "something is split evenly", "text": "A school ordered 96 markers for the art room, which is being repainted this month. The markers were packed into 8 identical boxes. How many markers were in each box?", "unknownDescription": "markers per box", "equation": "x = 96 / 8", "answer": 12, "answerUnit": "markers" },
            { "id": 14, "tier": 2, "type": "multiplicative", "classificationLabel": "one is a multiple of the other", "text": "The aquarium has 5 times as many goldfish as angelfish, and it also has a new coral display near the entrance. There are 8 angelfish. How many goldfish are there?", "unknownDescription": "number of goldfish", "equation": "x = 5 * 8", "answer": 40, "answerUnit": "goldfish" },
            { "id": 15, "tier": 2, "type": "partwhole", "classificationLabel": "parts add up to a whole", "text": "The school food drive also collected winter coats for donation. In total, 120 canned goods were donated. 68 of them were vegetable cans. How many were fruit cans?", "unknownDescription": "number of fruit cans", "equation": "x + 68 = 120", "answer": 52, "answerUnit": "cans" },
            { "id": 16, "tier": 2, "type": "rate", "classificationLabel": "a rate or ratio", "text": "A car travels at a steady speed of 55 miles per hour on the highway. If the trip takes 4 hours, and the driver stops once for gas, how many miles does the car travel?", "unknownDescription": "total miles traveled", "equation": "x = 55 * 4", "answer": 220, "answerUnit": "miles" },
            { "id": 17, "tier": 2, "type": "comparison", "classificationLabel": "one is more/less than the other", "text": "Nora, who plays soccer on Saturdays, has 15 fewer trading cards than her cousin Mateo. Mateo has 41 cards. How many cards does Nora have?", "unknownDescription": "Nora's number of cards", "equation": "x = 41 - 15", "answer": 26, "answerUnit": "cards" },
            { "id": 18, "tier": 2, "type": "spliteven", "classificationLabel": "something is split evenly", "text": "A charity packed 144 backpacks with school supplies for the community drive. The backpacks were divided equally among 6 volunteer teams to hand out. How many backpacks did each team hand out?", "unknownDescription": "backpacks per team", "equation": "x = 144 / 6", "answer": 24, "answerUnit": "backpacks" },
            { "id": 19, "tier": 3, "type": "comparison", "classificationLabel": "one is more/less than the other", "text": "A community 5K race had 187 more adult runners than youth runners. The race also included a bake sale table near the finish line. In total, 623 runners participated. How many youth runners were there?", "unknownDescription": "number of youth runners", "equation": "x + (x + 187) = 623", "answer": 218, "answerUnit": "runners" },
            { "id": 20, "tier": 3, "type": "multiplicative", "classificationLabel": "one is a multiple of the other", "text": "A tech company shipped 4 times as many tablets as laptops last quarter, alongside a new marketing campaign. They shipped 936 tablets in total. How many laptops did they ship?", "unknownDescription": "number of laptops", "equation": "4 * x = 936", "answer": 234, "answerUnit": "laptops" },
            { "id": 21, "tier": 3, "type": "rate", "classificationLabel": "a rate or ratio", "text": "A cyclist rode 96 miles over 4 hours at a steady pace, stopping briefly to refill her water bottle. What was her average speed in miles per hour?", "unknownDescription": "average speed", "equation": "x = 96 / 4", "answer": 24, "answerUnit": "mph" },
            { "id": 22, "tier": 3, "type": "partwhole", "classificationLabel": "parts add up to a whole", "text": "A shipment contains red, blue, and yellow bins, each with a packing slip taped to the lid. There are 240 bins total. 95 are red and 78 are blue. How many bins are yellow?", "unknownDescription": "number of yellow bins", "equation": "95 + 78 + x = 240", "answer": 67, "answerUnit": "bins" },
            { "id": 23, "tier": 3, "type": "comparison", "classificationLabel": "one is more/less than the other", "text": "Priya's savings account, which she opened last spring, has $145 less than her older brother Dev's account. Dev has $860 saved. How much does Priya have?", "unknownDescription": "Priya's savings", "equation": "x = 860 - 145", "answer": 715, "answerUnit": "dollars" },
            { "id": 24, "tier": 3, "type": "multiplicative", "classificationLabel": "one is a multiple of the other", "text": "A farmer has 3 times as many chickens as goats, and he also keeps two beehives near the barn. Together, the chickens and goats total 96 animals. How many goats does the farmer have?", "unknownDescription": "number of goats", "equation": "x + 3x = 96", "answer": 24, "answerUnit": "goats" },
            { "id": 25, "tier": 3, "type": "spliteven", "classificationLabel": "something is split evenly", "text": "A publishing company printed 1,248 copies of a new textbook for the fall semester, and also updated its shipping software. The copies were packed equally into 24 boxes for delivery to schools. How many textbooks were in each box?", "unknownDescription": "textbooks per box", "equation": "x = 1248 / 24", "answer": 52, "answerUnit": "textbooks" }
          ]
        };

        let state = {
            queue: Array.from({length: 25}, (_, i) => i + 1), // Problem IDs
            missedQueue: [],
            currentProblemCount: 0, // Total problems attempted so far
            currentProblem: null,
            activeStep: 1,
            
            // Current problem interaction state
            highlightedSentenceIndex: -1,
            step1Selection: null,
            step2Selection: null,
            equationTokens: [],
            step4Value: "",
            
            // Stats
            stats: {
                totalDone: 0,
                step2Total: 0,
                step2FirstTryPass: 0,
                step4Total: 0,
                step4FirstTryPass: 0
            },
            
            // Track failures in current problem to avoid double penalizing
            currentProblemFailedStep2: false,
            currentProblemFailedStep4: false
        };

        const DOM = {
            main: document.getElementById('main-content'),
            progress: document.getElementById('progress-indicator')
        };

        // Utility: Get random items
        function getRandomDistractors(correctAnswer, count = 3) {
            const others = quizData.problems
                .filter(p => p.unknownDescription !== correctAnswer)
                .map(p => p.unknownDescription);
            const shuffled = others.sort(() => 0.5 - Math.random());
            return shuffled.slice(0, count);
        }

        function shuffleArray(arr) {
            return arr.sort(() => 0.5 - Math.random());
        }

        function init() {
            // Check for saved stats (simulated local storage persistence)
            const saved = localStorage.getItem('wpStats');
            if(saved) {
                try { state.stats = JSON.parse(saved); } catch(e){}
            }
            loadNextProblem();
        }

        function loadNextProblem() {
            if (state.queue.length === 0 && state.missedQueue.length === 0) {
                renderDashboard();
                return;
            }

            let nextId;
            // Spaced re-surfacing: Every 3rd problem, try to pull from missed queue
            if (state.currentProblemCount > 0 && state.currentProblemCount % 3 === 0 && state.missedQueue.length > 0) {
                nextId = state.missedQueue.shift();
            } else if (state.queue.length > 0) {
                nextId = state.queue.shift();
            } else {
                nextId = state.missedQueue.shift();
            }

            state.currentProblem = quizData.problems.find(p => p.id === nextId);
            state.currentProblemCount++;
            
            // Reset active problem state
            state.activeStep = 1;
            state.highlightedSentenceIndex = -1;
            state.step1Selection = null;
            state.step2Selection = null;
            state.equationTokens = [];
            state.step4Value = "";
            state.currentProblemFailedStep2 = false;
            state.currentProblemFailedStep4 = false;

            DOM.progress.innerText = `Problem ${state.currentProblemCount}`;
            renderProblem();
        }

        function renderProblem() {
            const p = state.currentProblem;
            
            // Parse sentences for highlighting
            const sentences = p.text.match(/[^.?!]+[.?!]+/g) || [p.text];
            
            let html = `
                <!-- Always Visible Routine -->
                <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-4 shadow-sm fade-in">
                    <h3 class="font-bold text-indigo-900 mb-2 text-sm uppercase tracking-wider">Start Routine</h3>
                    <ol class="list-decimal list-inside text-indigo-800 space-y-1">
                        <li>Read the problem carefully.</li>
                        <li>Highlight the question sentence.</li>
                        <li>Name the unknown.</li>
                    </ol>
                </div>

                <!-- Problem Text -->
                <div class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm text-lg leading-relaxed fade-in">
                    ${sentences.map((s, i) => `
                        <span class="sentence-span cursor-pointer transition-colors duration-200 rounded px-1 ${state.highlightedSentenceIndex === i ? 'highlight-active' : 'hover:bg-slate-100'}" 
                              data-index="${i}">${s.trim()}</span>
                    `).join(' ')}
                </div>

                <!-- Step 1: Name the Unknown -->
                <div id="step-1-container" class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm fade-in transition-all ${state.activeStep > 1 ? 'step-locked' : ''}">
                    <h3 class="font-semibold text-slate-800 mb-3"><span class="bg-slate-100 text-slate-500 py-1 px-2 rounded mr-2 text-sm">Step 1</span> Name the unknown</h3>
                    <div id="step-1-options" class="flex flex-col gap-2"></div>
                    <div id="step-1-feedback" class="mt-3 text-sm hidden font-medium"></div>
                    ${state.activeStep === 1 ? `<button onclick="checkStep1()" class="mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded transition-colors w-full sm:w-auto">Confirm</button>` : ''}
                </div>
                
                <!-- Step 2: Classify (Hidden initially) -->
                <div id="step-2-container" class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm transition-all hidden"></div>
                
                <!-- Step 3: Build Equation (Hidden initially) -->
                <div id="step-3-container" class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm transition-all hidden"></div>

                <!-- Step 4: Solve (Hidden initially) -->
                <div id="step-4-container" class="bg-white border border-slate-200 rounded-xl p-5 shadow-sm transition-all hidden"></div>
            `;

            DOM.main.innerHTML = html;

            // Attach highlighting listeners
            document.querySelectorAll('.sentence-span').forEach(el => {
                el.addEventListener('click', (e) => {
                    if(state.activeStep > 1) return; // Lock highlighting after step 1
                    document.querySelectorAll('.sentence-span').forEach(s => s.classList.remove('highlight-active'));
                    e.target.classList.add('highlight-active');
                    state.highlightedSentenceIndex = parseInt(e.target.getAttribute('data-index'));
                });
            });

            renderStep1Options();
        }

        function renderStep1Options() {
            const container = document.getElementById('step-1-options');
            if (state.activeStep === 1) {
                const options = shuffleArray([state.currentProblem.unknownDescription, ...getRandomDistractors(state.currentProblem.unknownDescription)]);
                container.innerHTML = options.map((opt, i) => `
                    <label class="flex items-center p-3 border border-slate-200 rounded cursor-pointer hover:bg-slate-50 transition-colors">
                        <input type="radio" name="unknown" value="${opt}" class="w-4 h-4 text-indigo-600 border-slate-300 focus:ring-indigo-500" onchange="state.step1Selection = this.value">
                        <span class="ml-3 text-slate-700">${opt}</span>
                    </label>
                `).join('');
            } else {
                container.innerHTML = `<div class="p-3 bg-emerald-50 border border-emerald-200 rounded text-emerald-800 font-medium flex items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    ${state.currentProblem.unknownDescription}
                </div>`;
            }
        }

        function showFeedback(stepId, msg, isError) {
            const fb = document.getElementById(`step-${stepId}-feedback`);
            fb.textContent = msg;
            fb.classList.remove('hidden', 'text-rose-600', 'text-emerald-600');
            fb.classList.add(isError ? 'text-rose-600' : 'text-emerald-600');
        }

        function checkStep1() {
            if (state.highlightedSentenceIndex === -1) {
                showFeedback(1, "Please highlight the question sentence in the text above first.", true);
                return;
            }
            if (!state.step1Selection) {
                showFeedback(1, "Please select what the unknown variable represents.", true);
                return;
            }
            
            if (state.step1Selection === state.currentProblem.unknownDescription) {
                showFeedback(1, "Spot on! Let's figure out how things relate.", false);
                state.activeStep = 2;
                renderStep1Options(); // Renders the locked state
                document.getElementById('step-1-container').classList.add('step-locked');
                renderStep2();
            } else {
                showFeedback(1, "Try again. Look closely at the question sentence you highlighted.", true);
            }
        }

        function renderStep2() {
            const container = document.getElementById('step-2-container');
            container.classList.remove('hidden');
            container.classList.add('fade-in');
            
            if (state.activeStep === 2) {
                state.stats.step2Total++;
                
                const html = `
                    <h3 class="font-semibold text-slate-800 mb-3"><span class="bg-slate-100 text-slate-500 py-1 px-2 rounded mr-2 text-sm">Step 2</span> What is the relationship?</h3>
                    <div class="flex flex-col gap-2">
                        ${quizData.relationshipTypes.map(type => `
                            <label class="flex items-center p-3 border border-slate-200 rounded cursor-pointer hover:bg-slate-50 transition-colors">
                                <input type="radio" name="relationship" value="${type}" class="w-4 h-4 text-indigo-600 border-slate-300 focus:ring-indigo-500" onchange="state.step2Selection = this.value">
                                <span class="ml-3 text-slate-700">${type}</span>
                            </label>
                        `).join('')}
                    </div>
                    <div id="step-2-feedback" class="mt-3 text-sm hidden font-medium"></div>
                    <button onclick="checkStep2()" class="mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded transition-colors w-full sm:w-auto">Confirm</button>
                `;
                container.innerHTML = html;
            } else {
                container.innerHTML = `
                    <h3 class="font-semibold text-slate-800 mb-3"><span class="bg-slate-100 text-slate-500 py-1 px-2 rounded mr-2 text-sm">Step 2</span> What is the relationship?</h3>
                    <div class="p-3 bg-emerald-50 border border-emerald-200 rounded text-emerald-800 font-medium flex items-center">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        ${state.currentProblem.classificationLabel}
                    </div>
                `;
                container.classList.add('step-locked');
            }
            
            // Scroll to it
            container.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function checkStep2() {
            if (!state.step2Selection) {
                showFeedback(2, "Please select a relationship type.", true);
                return;
            }
            
            if (state.step2Selection === state.currentProblem.classificationLabel) {
                if (!state.currentProblemFailedStep2) {
                    state.stats.step2FirstTryPass++;
                    saveStats();
                }
                state.activeStep = 3;
                renderStep2(); // Lock it
                renderStep3();
            } else {
                if (!state.currentProblemFailedStep2) {
                    state.currentProblemFailedStep2 = true;
                    // Tag for resurfacing if first try failed
                    if (!state.missedQueue.includes(state.currentProblem.id)) {
                        state.missedQueue.push(state.currentProblem.id);
                    }
                }
                showFeedback(2, "Not quite. Reread the highlighted sentence. Does it sound like parts making a total, or comparing two things?", true);
            }
        }

        function getAvailableTokens(problem) {
            // Extract numbers from the text to ensure they can use distractors if they get confused
            const textNums = (problem.text.match(/\d+/g) || []).map(String);
            const eqNums = (problem.equation.match(/\d+/g) || []).map(String);
            const allNums = Array.from(new Set([...textNums, ...eqNums]));
            
            // Core math tokens
            let tokens = ['x', '=', '+', '-', '*', '/', '(', ')'];
            
            // Add required numbers
            tokens = [...tokens, ...allNums];
            
            // Add common coefficients just in case
            if(!tokens.includes('2')) tokens.push('2');
            if(!tokens.includes('3')) tokens.push('3');

            return tokens;
        }

        function renderStep3() {
            const container = document.getElementById('step-3-container');
            container.classList.remove('hidden');
            container.classList.add('fade-in');
            
            if (state.activeStep === 3) {
                const tokens = getAvailableTokens(state.currentProblem);
                
                container.innerHTML = `
                    <h3 class="font-semibold text-slate-800 mb-3"><span class="bg-slate-100 text-slate-500 py-1 px-2 rounded mr-2 text-sm">Step 3</span> Build the equation</h3>
                    <p class="text-sm text-slate-600 mb-3">Click blocks to build an equation that matches the relationship you chose.</p>
                    
                    <!-- Equation Display Area -->
                    <div class="min-h-[3.5rem] bg-slate-50 border-2 border-dashed border-slate-300 rounded-lg p-2 mb-4 flex flex-wrap items-center gap-2" id="equation-display">
                        ${state.equationTokens.length === 0 ? '<span class="text-slate-400 text-sm italic">Your equation will appear here...</span>' : ''}
                        ${state.equationTokens.map((t, i) => `
                            <button onclick="removeToken(${i})" class="bg-white border border-slate-300 shadow-sm rounded px-3 py-1 text-slate-800 font-mono hover:bg-rose-50 hover:border-rose-300 hover:text-rose-700 transition-colors flex items-center gap-1 group">
                                ${t}
                                <svg class="w-3 h-3 opacity-0 group-hover:opacity-100 transition-opacity" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                            </button>
                        `).join('')}
                    </div>

                    <!-- Token Bank -->
                    <div class="flex flex-wrap gap-2 mb-4">
                        ${tokens.map(t => `
                            <button onclick="addToken('${t}')" class="bg-slate-100 border border-slate-200 hover:bg-slate-200 text-slate-800 font-mono font-bold rounded px-4 py-2 transition-colors active:scale-95 shadow-sm">
                                ${t}
                            </button>
                        `).join('')}
                    </div>
                    
                    <div class="flex justify-between items-center mt-4">
                        <button onclick="clearEquation()" class="text-sm text-slate-500 hover:text-slate-700 underline">Clear all</button>
                        <button onclick="checkStep3()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-6 rounded transition-colors">Check Equation</button>
                    </div>
                    <div id="step-3-feedback" class="mt-3 text-sm hidden font-medium"></div>
                `;
            } else {
                container.innerHTML = `
                    <h3 class="font-semibold text-slate-800 mb-3"><span class="bg-slate-100 text-slate-500 py-1 px-2 rounded mr-2 text-sm">Step 3</span> Build the equation</h3>
                    <div class="p-3 bg-emerald-50 border border-emerald-200 rounded text-emerald-800 font-mono font-medium flex items-center flex-wrap gap-2">
                         <svg class="w-5 h-5 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                         ${state.equationTokens.map(t => `<span class="bg-white border border-emerald-200 shadow-sm rounded px-2 py-0.5">${t}</span>`).join('')}
                    </div>
                `;
                container.classList.add('step-locked');
            }
            container.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function addToken(t) {
            state.equationTokens.push(t);
            renderStep3();
        }

        function removeToken(index) {
            state.equationTokens.splice(index, 1);
            renderStep3();
        }
        
        function clearEquation() {
            state.equationTokens = [];
            renderStep3();
        }

        function validateEquation(userTokens, targetEquation, answer) {
            if (userTokens.length === 0) return { ok: false, msg: "Your equation is empty." };
            const userStr = userTokens.join('');
            if (!userStr.includes('=')) return { ok: false, msg: "An equation must have an equals sign (=)." };

            // Prevent bypassing by just writing "x = answer"
            const reqNums = targetEquation.match(/\d+/g) || [];
            for (let n of reqNums) {
                if (!userTokens.includes(n)) {
                    return { ok: false, msg: "Make sure you are using all the important numbers from the problem in your equation." };
                }
            }

            try {
                let parts = userStr.split('=');
                if (parts.length !== 2 || !parts[0] || !parts[1]) return { ok: false, msg: "Make sure there is a math expression on both sides of the equals sign." };

                // Handle implicit multiplication if a user manually forces a number next to x without a * (though tokens should prevent this)
                const formatSide = (str) => {
                    return str.replace(/(\d)(x)/g, '$1*$2');
                }
                
                const leftSide = formatSide(parts[0]);
                const rightSide = formatSide(parts[1]);

                const evaluate = (expr, xVal) => {
                    let parsed = expr.replace(/x/g, `(${xVal})`);
                    return new Function(`return ${parsed}`)();
                };

                const leftAns = evaluate(leftSide, answer);
                const rightAns = evaluate(rightSide, answer);

                if (Math.abs(leftAns - rightAns) < 0.0001) {
                    // Identity check to avoid tautologies like x + 5 = x + 5
                    const leftWrong = evaluate(leftSide, answer + 10);
                    const rightWrong = evaluate(rightSide, answer + 10);
                    if (Math.abs(leftWrong - rightWrong) < 0.0001) {
                        return { ok: false, msg: "This equation is true for any number. Write one that helps solve for x." };
                    }
                    return { ok: true };
                } else {
                    return { ok: false, msg: "Check your relationship in step 2. Your equation should match that pattern." };
                }
            } catch (err) {
                return { ok: false, msg: "Your equation has a math symbol out of place. Check your order." };
            }
        }

        function checkStep3() {
            const result = validateEquation(state.equationTokens, state.currentProblem.equation, state.currentProblem.answer);
            
            if (result.ok) {
                showFeedback(3, "Perfect! Now solve it.", false);
                state.activeStep = 4;
                renderStep3(); // Lock
                renderStep4();
            } else {
                showFeedback(3, result.msg, true);
            }
        }

        function renderStep4() {
            const container = document.getElementById('step-4-container');
            container.classList.remove('hidden');
            container.classList.add('fade-in');
            
            if (state.activeStep === 4) {
                state.stats.step4Total++;
                
                container.innerHTML = `
                    <h3 class="font-semibold text-slate-800 mb-3"><span class="bg-slate-100 text-slate-500 py-1 px-2 rounded mr-2 text-sm">Step 4</span> Solve the equation</h3>
                    <div class="flex items-center gap-3">
                        <span class="text-xl font-mono text-slate-700">x = </span>
                        <input type="number" id="solve-input" class="border border-slate-300 rounded px-3 py-2 w-24 text-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="0">
                        <span class="text-slate-600">${state.currentProblem.answerUnit}</span>
                    </div>
                    <div id="step-4-feedback" class="mt-3 text-sm hidden font-medium"></div>
                    <button onclick="checkStep4()" class="mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-6 rounded transition-colors">Solve</button>
                `;
            }
            container.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function checkStep4() {
            const inputVal = document.getElementById('solve-input').value;
            if (inputVal.trim() === "") {
                showFeedback(4, "Please enter a number.", true);
                return;
            }
            
            const numVal = parseFloat(inputVal);
            
            if (numVal === state.currentProblem.answer) {
                if (!state.currentProblemFailedStep4) {
                    state.stats.step4FirstTryPass++;
                    saveStats();
                }
                state.stats.totalDone++;
                saveStats();
                
                const container = document.getElementById('step-4-container');
                container.innerHTML = `
                    <div class="text-center p-6 bg-emerald-50 rounded-xl border border-emerald-200 fade-in">
                        <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-emerald-100 text-emerald-600 mb-3">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                        <h3 class="text-xl font-bold text-emerald-800 mb-1">Excellent Work!</h3>
                        <p class="text-emerald-700 mb-4">You translated and solved the problem perfectly.</p>
                        <button onclick="loadNextProblem()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 px-6 rounded transition-colors shadow-sm">Next Problem</button>
                    </div>
                `;
            } else {
                if (!state.currentProblemFailedStep4) {
                    state.currentProblemFailedStep4 = true;
                     if (!state.missedQueue.includes(state.currentProblem.id)) {
                        state.missedQueue.push(state.currentProblem.id);
                    }
                }
                showFeedback(4, "Your equation is right, but check your math calculation.", true);
            }
        }

        function saveStats() {
            localStorage.setItem('wpStats', JSON.stringify(state.stats));
        }

        function renderDashboard() {
            DOM.progress.style.display = 'none';
            
            const s2Pct = state.stats.step2Total > 0 ? Math.round((state.stats.step2FirstTryPass / state.stats.step2Total) * 100) : 0;
            const s4Pct = state.stats.step4Total > 0 ? Math.round((state.stats.step4FirstTryPass / state.stats.step4Total) * 100) : 0;
            
            let s2Msg = "Great schema recognition!";
            if (s2Pct < 70) s2Msg = "We should review how to identify relationship keywords.";
            
            let s4Msg = "Solid computation skills!";
            if (s4Pct < 70) s4Msg = "Double-check arithmetic carefully once the equation is built.";

            const html = `
                <div class="bg-white border border-slate-200 rounded-xl p-8 shadow-sm text-center fade-in mt-6">
                    <h2 class="text-2xl font-bold text-slate-800 mb-2">Practice Complete!</h2>
                    <p class="text-slate-600 mb-8">Here is a breakdown of your performance by step.</p>
                    
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-8 text-left">
                        <div class="p-5 bg-slate-50 border border-slate-200 rounded-lg">
                            <h3 class="font-semibold text-slate-700 mb-1 text-sm uppercase tracking-wider">Step 2: Classify</h3>
                            <div class="flex items-end gap-2 mb-2">
                                <span class="text-3xl font-bold text-indigo-700">${s2Pct}%</span>
                                <span class="text-slate-500 mb-1">first-try success</span>
                            </div>
                            <p class="text-sm text-slate-600">${s2Msg}</p>
                        </div>
                        
                        <div class="p-5 bg-slate-50 border border-slate-200 rounded-lg">
                            <h3 class="font-semibold text-slate-700 mb-1 text-sm uppercase tracking-wider">Step 4: Solve</h3>
                            <div class="flex items-end gap-2 mb-2">
                                <span class="text-3xl font-bold text-indigo-700">${s4Pct}%</span>
                                <span class="text-slate-500 mb-1">first-try success</span>
                            </div>
                            <p class="text-sm text-slate-600">${s4Msg}</p>
                        </div>
                    </div>
                    
                    <button onclick="resetApp()" class="text-slate-500 hover:text-slate-700 underline text-sm">Reset Practice Data</button>
                </div>
            `;
            
            DOM.main.innerHTML = html;
        }

        function resetApp() {
            localStorage.removeItem('wpStats');
            location.reload();
        }

        // Initialize application
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
